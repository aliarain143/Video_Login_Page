<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
       video{
            position: fixed;
            z-index: -1;
            right: 0;
            bottom: 0;
        }
        .content{
            color: #fff;
            margin: 15% auto;
            width: 300px;
            height: 250px;
            border-radius: 25px;
            background-color: rgba(0, 0, 0, 0.1);
            box-shadow: 0 0 17px #fff;
            text-align: center;
            padding-top: 2px;
        }
        .content button:hover{
            box-shadow: 2px 2px 5px #fff;
            border-radius: 25px;
            background-color: rgba(0, 0, 0, 0.1);
            text-align: center;
            color: #fff;
            border: #fff;
        }
        .content input:hover{
            box-shadow: 2px 2px 5px #fff;
            border-radius: 25px;
            background-color: rgba(0, 0, 0, 0.1);
            text-align: center;
            color: #fff;
            border: #fff;
        }       
    </style>
</head>
<body>
    <video autoplay muted loop id="myvideo">
        <source src="background 3.mp4" type="video/mp4">
    </video>
    <div class="content">
        <h1>Login</h1>
        <form>
            <label for="email address">Email Address :</label>
            <input type="text" id="email address" placeholder="abc@gmail.com">
            <br>
            <br>
            <label for="password">Password :</label>
            <input type="password" id="password" placeholder="Password">
            <br>
            <br>
            <button>Login</button>
            <br>
            <br>
            <label for="memer">Not a member? <a href="Sign Up Video.html">Register Now</a></label>
        </form>
    </div>
    
</body>
</html>
